<svg width="1100" height="620" viewBox="0 0 1100 620" xmlns="http://www.w3.org/2000/svg" style="background:white;font-family:Arial,sans-serif">

  <!-- TITLE -->
  <text x="550" y="44" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a1a1a">AZURE END - TO - END  DATA PROJECT</text>

  <!-- ══ LEFT PANEL: Azure Storage Lake ══ -->
  <rect x="30" y="70" width="160" height="440" rx="14" fill="white" stroke="#aaa" stroke-width="1.5"/>
  <text x="110" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Azure Storage</text>
  <text x="110" y="118" text-anchor="middle" font-size="12" fill="#555">Lake</text>

  <!-- JSON icon: customers -->
  <rect x="56" y="132" width="108" height="28" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="110" y="151" text-anchor="middle" font-size="11" fill="#1e3a8a">customers.json</text>

  <!-- JSON icon: products -->
  <rect x="56" y="170" width="108" height="28" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="110" y="189" text-anchor="middle" font-size="11" fill="#1e3a8a">products.json</text>

  <!-- JSON icon: transactions -->
  <rect x="56" y="208" width="108" height="28" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="110" y="227" text-anchor="middle" font-size="11" fill="#1e3a8a">transactions.json</text>

  <!-- JSON icon: stores -->
  <rect x="56" y="246" width="108" height="28" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="110" y="265" text-anchor="middle" font-size="11" fill="#1e3a8a">stores.json</text>

  <!-- divider -->
  <line x1="50" y1="290" x2="170" y2="290" stroke="#ccc" stroke-width="1"/>

  <!-- ADF icon (simple bar chart shape) -->
  <rect x="86" y="308" width="10" height="30" rx="2" fill="#0078d4"/>
  <rect x="100" y="298" width="10" height="40" rx="2" fill="#0078d4"/>
  <rect x="114" y="318" width="10" height="20" rx="2" fill="#0078d4"/>
  <rect x="128" y="303" width="10" height="35" rx="2" fill="#0078d4"/>

  <text x="110" y="366" text-anchor="middle" font-size="12" font-weight="bold" fill="#0078d4">Azure Data</text>
  <text x="110" y="382" text-anchor="middle" font-size="12" font-weight="bold" fill="#0078d4">Factory</text>

  <!-- Arrow ADF → Databricks -->
  <line x1="190" y1="370" x2="278" y2="370" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- ══ DATABRICKS CONTAINER ══ -->
  <rect x="280" y="70" width="590" height="440" rx="22" fill="white" stroke="#aaa" stroke-width="1.5"/>

  <!-- Databricks label + logo area -->
  <text x="620" y="106" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Data bricks</text>
  <!-- Databricks logo (3 stacked trapezoids) -->
  <polygon points="660,82 700,82 716,100 700,118 660,118 644,100" fill="#FF3621" opacity="0.85"/>
  <polygon points="664,88 696,88 708,100 696,112 664,112 652,100" fill="#FF6B47" opacity="0.7"/>
  <polygon points="668,94 692,94 700,100 692,106 668,106 660,100" fill="white" opacity="0.5"/>

  <!-- BRONZE LAYER header -->
  <text x="390" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">Bronze Layer</text>

  <!-- df_transaction box -->
  <rect x="300" y="152" width="180" height="38" rx="6" fill="white" stroke="#999" stroke-width="1"/>
  <text x="390" y="176" text-anchor="middle" font-size="12" fill="#222">df_transaction</text>

  <!-- df_stores box -->
  <rect x="300" y="202" width="180" height="38" rx="6" fill="white" stroke="#999" stroke-width="1"/>
  <text x="390" y="226" text-anchor="middle" font-size="12" fill="#222">df_stores</text>

  <!-- df_product box -->
  <rect x="300" y="252" width="180" height="38" rx="6" fill="white" stroke="#999" stroke-width="1"/>
  <text x="390" y="276" text-anchor="middle" font-size="12" fill="#222">df_product</text>

  <!-- df_customers box -->
  <rect x="300" y="302" width="180" height="38" rx="6" fill="white" stroke="#999" stroke-width="1"/>
  <text x="390" y="326" text-anchor="middle" font-size="12" fill="#222">df_customers</text>

  <!-- Arrow Bronze → Silver -->
  <line x1="480" y1="290" x2="528" y2="290" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- SILVER LAYER -->
  <text x="618" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">Silver Layer</text>
  <rect x="530" y="260" width="176" height="60" rx="8" fill="white" stroke="#999" stroke-width="1"/>
  <text x="618" y="295" text-anchor="middle" font-size="13" fill="#222">df_silver</text>

  <!-- Arrow Silver → Gold -->
  <line x1="706" y1="290" x2="748" y2="290" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- GOLD LAYER -->
  <text x="838" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">Gold Layer</text>
  <rect x="750" y="260" width="100" height="60" rx="8" fill="white" stroke="#999" stroke-width="1"/>
  <text x="800" y="295" text-anchor="middle" font-size="13" fill="#222">df_gold</text>

  <!-- Arrow Gold → right output -->
  <line x1="870" y1="290" x2="920" y2="290" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- ══ RIGHT PANEL: Delta Lake Output ══ -->
  <rect x="920" y="70" width="158" height="440" rx="14" fill="white" stroke="#aaa" stroke-width="1.5"/>
  <text x="999" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Delta Lake</text>
  <text x="999" y="122" text-anchor="middle" font-size="12" fill="#555">Output data</text>

  <!-- Delta logo triangle -->
  <polygon points="999,138 964,196 1034,196" fill="#00A4EF" opacity="0.9"/>
  <text x="999" y="190" text-anchor="middle" font-size="10" fill="white" font-weight="bold">DELTA</text>

  <!-- Arrow down to report -->
  <line x1="999" y1="200" x2="999" y2="310" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Power BI bar chart icon -->
  <rect x="954" y="318" width="20" height="50" rx="3" fill="#F2C811"/>
  <rect x="980" y="306" width="20" height="62" rx="3" fill="#F2C811"/>
  <rect x="1006" y="330" width="20" height="38" rx="3" fill="#F2C811"/>

  <text x="999" y="388" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Retail Project</text>
  <text x="999" y="406" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Report</text>

  <!-- BOTTOM AUTHOR -->
  <line x1="30" y1="530" x2="1070" y2="530" stroke="#ddd" stroke-width="1"/>
  <text x="550" y="558" text-anchor="middle" font-size="12" fill="#999">Azure ETL Pipeline — ADF + Databricks + Delta Lake + Medallion Architecture</text>
  <text x="550" y="578" text-anchor="middle" font-size="11" fill="#bbb">Bronze → Silver → Gold  |  PySpark Transformations  |  Google Colab</text>

  <!-- ARROW MARKER -->
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

</svg>
